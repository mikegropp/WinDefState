name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run dependency-free smoke tests
        shell: pwsh
        run: ./tests/Smoke.ps1
      - name: Install test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Run static analysis
        shell: pwsh
        run: ./tests/Analyze.ps1
      - name: Run cross-platform contract tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI

  windows-powershell:
    name: Windows PowerShell 5.1 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run dependency-free smoke tests
        shell: powershell
        run: .\tests\Smoke.ps1
      - name: Instantiate and validate the WPF visual tree
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Sta -File .\WinDefState.Gui.ps1 -ValidateOnly
      - name: Validate the read-only inspection dashboard
        shell: powershell
        run: powershell.exe -NoProfile -Sta -File .\tests\InspectionGui.ps1
      - name: Install test dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Run static analysis on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Analyze.ps1
      - name: Run tests on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          Write-Host "Pester version: $((Get-Module Pester).Version)"
          Invoke-Pester -Path .\tests -CI
